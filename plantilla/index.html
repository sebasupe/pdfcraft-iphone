<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PdfCraft</title>
    <meta name="description" content="PdfCraft: lector, anotador y editor de PDF completo para iPhone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PdfCraft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./movil.css" />
    <style>
      #pc-splash {
        position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 24px;
        background: var(--bg); color: var(--fg); transition: opacity .3s ease;
      }
      #pc-splash.pc-out { opacity: 0; pointer-events: none; }
      #pc-splash img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
      #pc-splash h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
      #pc-track { width: min(260px, 70vw); height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
      #pc-bar { width: 2%; height: 100%; background: var(--accent); transition: width .15s linear; }
      #pc-status { color: var(--muted); font-size: 14px; min-height: 1.4em; text-align: center; }
      #pc-error { max-width: 320px; color: var(--fg); font-size: 13px; text-align: center; white-space: pre-wrap; }
    </style>
    <script>
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("pdfcraft-movil") || "{}");
          if (raw.tema === "oscuro") document.documentElement.setAttribute("data-theme", "dark");
          else if (raw.tema === "claro") document.documentElement.setAttribute("data-theme", "light");
          var calidad = raw.calidad || "fluida";
          var realDpr = window.devicePixelRatio || 1;
          window.__pdfcraftNativeDpr = realDpr;
          var cap = calidad === "maxima" ? realDpr : calidad === "rapida" ? 1.5 : 2;
          var target = Math.min(realDpr, cap);
          window.__pdfcraftActiveDpr = target;
          if (realDpr > target + 0.01) {
            Object.defineProperty(window, "devicePixelRatio", { get: function () { return target; }, configurable: true });
            if (typeof ResizeObserverEntry !== "undefined" && typeof ResizeObserverSize !== "undefined") {
              var dpDesc = Object.getOwnPropertyDescriptor(ResizeObserverEntry.prototype, "devicePixelContentBoxSize");
              var inDesc = Object.getOwnPropertyDescriptor(ResizeObserverSize.prototype, "inlineSize");
              var blDesc = Object.getOwnPropertyDescriptor(ResizeObserverSize.prototype, "blockSize");
              if (dpDesc && dpDesc.get && inDesc && inDesc.get && blDesc && blDesc.get) {
                var dpGet = dpDesc.get, inGet = inDesc.get, blGet = blDesc.get;
                var scaled = new WeakMap();
                Object.defineProperty(ResizeObserverEntry.prototype, "devicePixelContentBoxSize", {
                  configurable: true,
                  get: function () {
                    var arr = dpGet.call(this);
                    if (arr && arr.length) {
                      var css = this.contentBoxSize;
                      var k = target / realDpr;
                      for (var i = 0; i < arr.length; i++) {
                        if (css && css.length) {
                          var c = css[Math.min(i, css.length - 1)];
                          scaled.set(arr[i], [Math.max(1, Math.round(inGet.call(c) * target)), Math.max(1, Math.round(blGet.call(c) * target))]);
                        } else {
                          scaled.set(arr[i], [Math.max(1, Math.round(inGet.call(arr[i]) * k)), Math.max(1, Math.round(blGet.call(arr[i]) * k))]);
                        }
                      }
                    }
                    return arr;
                  },
                });
                Object.defineProperty(ResizeObserverSize.prototype, "inlineSize", {
                  configurable: true,
                  get: function () { var s = scaled.get(this); return s ? s[0] : inGet.call(this); },
                });
                Object.defineProperty(ResizeObserverSize.prototype, "blockSize", {
                  configurable: true,
                  get: function () { var s = scaled.get(this); return s ? s[1] : blGet.call(this); },
                });
              }
            }
          }
        } catch (e) {}
      })();
      window.pdfcraftSeedSettings = function () {
        try {
          if (localStorage.getItem("pdfcraft") !== null) return;
          localStorage.setItem("pdfcraft", JSON.stringify({
            right_panel_closed: true,
            comments_panel_closed: true,
            update_check_at_start: false,
            side_panels: { rail_side: "right", side_width: 300, tools_open: false, tools_side: "left", tools_width: 260, version: 1 }
          }));
        } catch (e) {}
      };
    </script>
    __HEAD_LINKS__
  </head>
  <body>
    <div id="pc-splash" role="status" aria-live="polite">
      <img src="./icons/icon-192.png" alt="" />
      <h1>PdfCraft</h1>
      <div id="pc-track"><div id="pc-bar"></div></div>
      <div id="pc-status">Cargando…</div>
      <div id="pc-error" hidden></div>
    </div>

    <!-- Shell principal (Inicio / Espacios / Archivos / Buscar / Herramientas) -->
    <section id="pc-home" class="pc-screen" aria-label="Inicio">
      <header class="pc-app-head" id="pc-app-head"></header>
      <main class="pc-tab-body" id="pc-tab-body"></main>
      <button class="pc-create-fab" id="pc-create-fab" type="button" aria-label="Crear o abrir PDF"></button>
      <nav class="pc-tabbar-wrap" aria-label="Navegación principal">
        <div class="pc-tabbar" id="pc-tabbar"></div>
      </nav>
    </section>

    <!-- Visor de documento a pantalla completa -->
    <section id="pc-viewer" class="pc-screen" aria-label="Documento">
      <header class="pc-bar pc-top" id="pc-top"></header>
      <div id="pc-tts-bar" class="pc-tts-bar" hidden></div>
      <div id="pc-doc">
        <canvas id="pdfcraft" data-host="page"></canvas>
        <div id="pc-reader" hidden></div>
        <div id="pc-liquid" class="pc-liquid" hidden></div>
        <div class="pc-dimmer" id="pc-dimmer" aria-hidden="true"></div>
        <div class="pc-press-ring" id="pc-press-ring" hidden aria-hidden="true"></div>
        <div class="pc-shield" id="pc-shield" hidden></div>
        <div class="pc-busy" id="pc-busy" hidden><div class="pc-spinner"></div><span id="pc-busy-text">Abriendo…</span></div>

        <!-- Aviso flotante de modo (ej. "Toque el documento para añadir texto") -->
        <div class="pc-mode-hint" id="pc-mode-hint" hidden></div>

        <!-- Botón flotante "Volver a pág. X" cuando se salta con índice/enlace -->
        <button class="pc-back-jump" id="pc-back-jump" type="button" hidden></button>

        <!-- Botón sutil para salir de pantalla completa si el usuario tocó la página -->
        <button class="pc-imm-exit" id="pc-imm-exit" type="button" aria-label="Mostrar controles"></button>

        <!-- Navegador vertical deslizable en el borde derecho (idéntico a Acrobat iPhone) -->
        <div class="pc-vthumb-track" id="pc-vthumb-track" hidden>
          <button class="pc-vthumb" id="pc-vthumb" type="button" aria-label="Deslizar o ir a una página">1</button>
        </div>
        <div class="pc-vthumb-tip" id="pc-vthumb-tip" hidden>Pág. 1 de 1</div>

        <!-- Controles de paso rápido solo en vista Página única -->
        <div class="pc-single-nav" id="pc-single-nav" hidden>
          <button class="pc-snav-btn" id="pc-page-prev" type="button" aria-label="Página anterior"></button>
          <button class="pc-snav-pill" id="pc-page-pill" type="button" aria-label="Ir a página">1 / 1</button>
          <button class="pc-snav-btn" id="pc-page-next" type="button" aria-label="Página siguiente"></button>
        </div>
      </div>

      <!-- Barra inferior del visor -->
      <footer class="pc-bar pc-bottom" id="pc-bottom">
        <button class="pc-bottom-grab" id="pc-bottom-grab" type="button" aria-label="Más herramientas"></button>
        <div class="pc-viewer-nav" id="pc-viewer-nav"></div>
        <div class="pc-toolbar" id="pc-toolbar" hidden></div>
      </footer>
    </section>

    <!-- Vista nativa a pantalla completa de Páginas / Organizar páginas -->
    <section id="pc-pages-overlay" class="pc-pages-overlay" hidden aria-label="Páginas"></section>

    <input type="file" id="pc-file" accept="application/pdf,.pdf" hidden />
    <input type="file" id="pc-files-multi" accept="application/pdf,.pdf" multiple hidden />
    <input type="file" id="pc-img-gallery" accept="image/*" multiple hidden />
    <input type="file" id="pc-img-camera" accept="image/*" capture="environment" hidden />

    <script src="./vendor/pdf-lib.min.js"></script>
    <script src="./iphone.js"></script>
    <script src="./gestos.js"></script>
    <script src="./scanner.js"></script>
    <script src="./lector.js"></script>
    <script src="./organizar.js"></script>
    <script src="./movil.js"></script>
    <script type="module">
      import init, * as bindings from "./__GLUE__";
      const wasmResponse = await window.pdfcraftFetchWasm("./__WASM__", __WASM_BYTES__);
      const wasm = await init({ module_or_path: wasmResponse });
      window.wasmBindings = bindings;
      dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
    </script>
  </body>
</html>
