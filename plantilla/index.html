<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PdfCraft</title>
    <meta name="description" content="PdfCraft: lector y editor de PDF, instalado en tu iPhone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PdfCraft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./movil.css" />
    <style>
      #pc-splash {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 24px;
        background: var(--bg); color: var(--fg); transition: opacity .3s ease;
      }
      #pc-splash.pc-out { opacity: 0; pointer-events: none; }
      #pc-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
      #pc-splash h1 { margin: 6px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
      #pc-track { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
      #pc-bar { width: 2%; height: 100%; background: var(--accent); transition: width .15s linear; }
      #pc-status { color: var(--muted); font-size: 14px; min-height: 1.4em; text-align: center; }
      #pc-error { max-width: 320px; color: var(--fg); font-size: 13px; text-align: center; white-space: pre-wrap; }
    </style>
    <script>
      // Primera vez: los paneles laterales de PdfCraft cerrados y sin buscar actualizaciones por
      // su cuenta (la app se actualiza sola). El tamaño de la interfaz lo ajusta movil.js.
      window.pdfcraftSeedSettings = function () {
        try {
          if (localStorage.getItem("pdfcraft") !== null) return;
          localStorage.setItem("pdfcraft", JSON.stringify({
            right_panel_closed: true,
            comments_panel_closed: true,
            update_check_at_start: false,
            side_panels: { rail_side: "right", side_width: 300, tools_open: false, tools_side: "left", tools_width: 260, version: 1 }
          }));
        } catch (e) { /* sin almacenamiento: arranca con lo predeterminado */ }
      };
    </script>
    __HEAD_LINKS__
  </head>
  <body>
    <div id="pc-splash" role="status" aria-live="polite">
      <img src="./icons/icon-192.png" alt="" />
      <h1>PdfCraft</h1>
      <div id="pc-track"><div id="pc-bar"></div></div>
      <div id="pc-status">Cargando…</div>
      <div id="pc-error" hidden></div>
    </div>

    <!-- Inicio: abrir, herramientas y archivos recientes -->
    <section id="pc-home" class="pc-screen" aria-label="Inicio">
      <header class="pc-home-head">
        <img src="./icons/icon-192.png" alt="" />
        <h1>Inicio</h1>
        <button class="pc-round" id="pc-settings" type="button" aria-label="Ajustes"></button>
      </header>
      <main class="pc-home-body">
        <button class="pc-open" id="pc-open" type="button">
          <span data-icon="open"></span>
          <span><b>Abrir un PDF</b><small>Desde Archivos, iCloud Drive u otra app</small></span>
        </button>
        <div class="pc-section"><h2>Herramientas</h2></div>
        <div class="pc-tools" id="pc-tools"></div>
        <div class="pc-section"><h2>Recientes</h2></div>
        <ul class="pc-recents" id="pc-recents" aria-label="Archivos recientes"></ul>
        <div class="pc-empty" id="pc-empty" hidden>
          <div data-icon="file"></div>
          Aquí aparecerán los PDF que abras. Se guardan en esta app junto con tus cambios.
        </div>
      </main>
    </section>

    <!-- Visor: el documento a pantalla completa con barras de celular -->
    <section id="pc-viewer" class="pc-screen" aria-label="Documento">
      <header class="pc-bar pc-top" id="pc-top"></header>
      <div id="pc-doc">
        <canvas id="pdfcraft" data-host="page"></canvas>
        <div class="pc-shield" id="pc-shield" hidden></div>
        <div class="pc-busy" id="pc-busy" hidden><div class="pc-spinner"></div><span id="pc-busy-text">Abriendo…</span></div>
        <button class="pc-float pc-pill" id="pc-pill" type="button" aria-label="Ir a una página">1 / 1</button>
        <button class="pc-float pc-fab" id="pc-fab" type="button" aria-label="Herramientas"></button>
      </div>
      <footer class="pc-bar pc-toolbar" id="pc-toolbar" hidden></footer>
    </section>

    <input type="file" id="pc-file" accept="application/pdf,.pdf" hidden />

    <script src="./iphone.js"></script>
    <script src="./gestos.js"></script>
    <script src="./movil.js"></script>
    <script type="module">
      import init, * as bindings from "./__GLUE__";
      const wasmResponse = await window.pdfcraftFetchWasm("./__WASM__", __WASM_BYTES__);
      const wasm = await init({ module_or_path: wasmResponse });
      window.wasmBindings = bindings;
      dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
    </script>
  </body>
</html>
